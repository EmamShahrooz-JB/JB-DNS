  <text x="74" y="38" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F6FC" direction="rtl">پشتیبانی JB-DNS</text>
  <text x="74" y="56" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="9" fill="#8FB2C7" direction="rtl">آنلاین — معمولاً زیر چند ساعت پاسخ می‌دهیم</text>
  <circle cx="374" cy="42" r="4" fill="#2BB673"/>
  <rect x="36" y="96" width="300" height="58" rx="15" fill="none" stroke="#1B3358" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="186" y="119" text-anchor="middle" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="10.5" fill="#8FB2C7" direction="rtl">سلام! 👋 این گفتگو مستقیم به سازنده وصل است…</text>
  <rect x="90" y="170" width="294" height="76" rx="15" fill="#0D2044"/>
  <text x="237" y="194" text-anchor="middle" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="11.5" fill="#E8F6FC" direction="rtl">سلام. روی شبکهٔ مخابرات، سرور الکترو خیلی کند شد</text>
  <text x="237" y="230" text-anchor="middle" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="8" fill="#8FB2C7" direction="ltr">✓✓ ۱۱:۰۶</text>
  <rect x="36" y="262" width="294" height="92" rx="15" fill="#0D2044"/>
  <text x="183" y="286" text-anchor="middle" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="11.5" fill="#E8F6FC" direction="rtl">سلام! ممنون از گزارش 🙏 روی مخابرات این مشکل</text>
  <text x="183" y="306" text-anchor="middle" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="11.5" fill="#E8F6FC" direction="rtl">شناخته‌شده است — فعلاً «شکن» را امتحان کن.</text>
  <text x="316" y="342" text-anchor="middle" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="8" fill="#8FB2C7">۱۱:۱۰</text>
  <rect x="130" y="370" width="254" height="76" rx="15" fill="url(#me)"/>
  <text x="257" y="394" text-anchor="middle" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="11.5" fill="#ffffff" direction="rtl">مرسی، با شکن درست شد ✅</text>
  <text x="368" y="432" text-anchor="middle" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="8" fill="#DFF6FF">⏱</text>
  <rect x="30" y="478" width="288" height="42" rx="21" fill="#0D2044"/>
  <text x="70" y="504" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="11" fill="#8FB2C7" direction="rtl">پیامت را بنویس…</text>
  <circle cx="344" cy="499" r="20" fill="#0D2044"/>

<svg xmlns="http://www.w3.org/2000/svg" width="420" height="560" viewBox="0 0 420 560" role="img" aria-label="گفتگوی پشتیبانی JB-DNS">
  <defs>
    <linearGradient id="me" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0077B6"/><stop offset="1" stop-color="#0096C7"/>
    </linearGradient>
  </defs>
  <rect width="420" height="560" rx="36" fill="#030820"/>
  <rect x="10" y="10" width="400" height="540" rx="28" fill="#030820" stroke="#12284A" stroke-width="2"/>
  <rect x="10" y="10" width="400" height="64" rx="28" fill="#0A1836"/>
  <rect x="10" y="46" width="400" height="28" fill="#0A1836"/>
